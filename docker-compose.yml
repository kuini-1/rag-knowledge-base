# docker compose up --build
# Then open http://localhost:3000. Copy .env.example to .env first.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 20

  embedder:
    build: ./embedder
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      retries: 30
      start_period: 30s

  api:
    build: .
    env_file: .env
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_EMBED_URL: http://embedder:8001
    volumes:
      - data:/data
    depends_on:
      qdrant:
        condition: service_healthy
      embedder:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        RAG_API_URL: http://api:8090
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  qdrant:
  data:
